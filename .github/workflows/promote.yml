name: Promote staged captured papers

# LiterView capture-proof corpus (ledger task lp3-capture-proof; migration 067, applied to production
# 2026-10-26 22:06Z). The capture drain writes a captured paper whose venue the pipeline's journal list
# does not cover as `corpus_tier = 'staged'`: no page, not listed, no author links, not counted in its
# journal. pipeline/promote_captured.py (a copy of the LiterView master) promotes a staged paper to
# 'core' once its stored venue matches a configured journal, so a journal added to journals_config.py
# reaches the papers users captured before it was added. Without this schedule staged papers are
# never promoted.
#
# Daily at 01:30 UTC, after the 00:00 crawl, and by hand. The job is idempotent (a second run
# promotes nothing), takes one transaction per paper guarded by `corpus_tier = 'staged'`, and writes
# one promote_runs row per run. Its own concurrency group: it runs beside a crawl or a drain safely,
# since each promotion is a guarded UPDATE.
#
# This repository is public: promote_captured.py logs counts and paper ids only. The 60-day
# auto-disable of scheduled workflows in a public repository is covered by gh-cron-watchdog.

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ingest.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ingest.txt

      - name: Promote staged captured papers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        working-directory: pipeline
        run: python promote_captured.py --apply

      - name: Notify on failure (email)
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 pipeline/alert_email.py \
            --title "LiterView promote_captured FAILED" \
            --body "promote.yml failed, so staged captured papers are not being promoted to the corpus. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
